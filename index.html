<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ever After</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --deep-purple:#2b1a4a;--soft-purple:#7c5ba6;--rose-gold:#d9a89c;--blush-pink:#f3c9d6;--soft-pink:#ffe3ee;
  --ink:#fdf6fa;--muted:#e6d4ec;--glow:0 0 40px rgba(216,168,220,.35);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:'Quicksand',sans-serif;color:var(--ink);}
body{background:radial-gradient(ellipse at 50% -10%,#4a2d72 0%,var(--deep-purple) 45%,#1a0f30 100%);overflow:hidden;position:relative;}
.hidden{display:none !important;}

/* ---------- background ---------- */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:.9;}}
.glow-orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.4;z-index:0;}

/* ---------- lock screen ---------- */
#lockScreen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:28px;}
.headline{display:flex;flex-direction:column;align-items:center;gap:8px;}
.wordmark{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(22px,6vw,30px);color:var(--soft-pink);text-shadow:0 0 18px rgba(255,200,225,.5);text-align:center;line-height:1.2;}
.subline{font-size:13px;color:var(--muted);opacity:.8;text-align:center;}
#userSelect{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;width:100%;max-width:420px;}
.card{flex:1 1 160px;max-width:180px;background:linear-gradient(160deg,rgba(124,91,166,.28),rgba(217,168,156,.16));border:1px solid rgba(255,227,238,.35);border-radius:26px;padding:26px 14px 18px;text-align:center;backdrop-filter:blur(6px);box-shadow:var(--glow);cursor:pointer;transition:transform .2s;}
.card:active{transform:scale(.96);}
.emoji{font-size:52px;display:block;filter:drop-shadow(0 0 14px rgba(255,215,235,.55));}
.status-line{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;}
.dot{width:7px;height:7px;border-radius:50%;background:#8effa8;box-shadow:0 0 8px #8effa8;}
.dot.offline{background:#c9b6d9;box-shadow:none;}
.unread{margin-top:10px;font-size:12px;color:#2b1a4a;background:linear-gradient(120deg,var(--soft-pink),var(--rose-gold));padding:4px 10px;border-radius:20px;display:inline-flex;font-weight:600;}
#passwordPanel{display:none;width:100%;max-width:340px;text-align:center;}
.selected-emoji{font-size:56px;filter:drop-shadow(0 0 16px rgba(255,215,235,.6));}
.pw-label{margin:10px 0 18px;color:var(--muted);font-size:14px;}
input[type="password"],input[type="text"],input[type="date"]{width:100%;padding:14px 16px;border-radius:18px;border:1px solid rgba(255,227,238,.4);background:rgba(255,255,255,.07);color:var(--ink);font-size:16px;font-family:inherit;outline:none;text-align:center;}
.error-msg{color:#ffb4c6;font-size:12.5px;margin-top:10px;min-height:16px;}
.btn-row{display:flex;gap:10px;margin-top:18px;}
button.primary{flex:1;padding:13px;border:none;border-radius:18px;font-family:inherit;font-weight:600;font-size:14.5px;background:linear-gradient(120deg,var(--soft-purple),var(--rose-gold));color:#fff;cursor:pointer;}
button.ghost{padding:13px 18px;border-radius:18px;border:1px solid rgba(255,227,238,.35);background:transparent;color:var(--muted);font-family:inherit;font-size:14px;cursor:pointer;}

/* ---------- chat screen ---------- */
#chatScreen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;}
#topBar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(255,255,255,.05);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,227,238,.15);cursor:pointer;}
#topBar .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--soft-purple),var(--rose-gold));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;}
#topBar .tinfo{display:flex;flex-direction:column;}
#topBar .tname{font-weight:600;font-size:15px;}
#topBar .tstatus{font-size:12px;color:var(--muted);}
#statusBubble{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:rgba(43,26,74,.85);border:1px solid rgba(255,227,238,.3);padding:6px 16px;border-radius:20px;font-size:12px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
#statusBubble.show{opacity:1;}
#moodBar{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid rgba(255,227,238,.1);}
.mood-chip{flex:0 0 auto;padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,227,238,.2);font-size:12.5px;cursor:pointer;white-space:nowrap;}
.mood-chip.active{background:linear-gradient(120deg,var(--soft-purple),var(--rose-gold));}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.4;position:relative;}
.bubble.me{align-self:flex-end;background:linear-gradient(120deg,var(--soft-purple),var(--rose-gold));border-bottom-right-radius:6px;}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.08);border-bottom-left-radius:6px;}
.bubble.action{align-self:center;background:rgba(255,227,238,.12);font-style:italic;font-size:13px;border-radius:14px;}
.bubble .meta{font-size:10.5px;opacity:.7;margin-top:4px;text-align:right;}
.bubble audio{max-width:200px;}
.bubble img,.bubble video{max-width:200px;border-radius:12px;display:block;}
#inputRow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid rgba(255,227,238,.15);background:rgba(255,255,255,.04);}
#emojiBtn,#micBtn,#attachBtn,#sendBtn{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#sendBtn{background:linear-gradient(120deg,var(--soft-purple),var(--rose-gold));}
#micBtn.recording{background:#ff5c7a;animation:pulseBadge 1s infinite;}
@keyframes pulseBadge{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
#textInput{flex:1;min-width:0;padding:11px 16px;border-radius:20px;border:1px solid rgba(255,227,238,.25);background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;font-family:inherit;outline:none;}
#actionPanel,#profilePanel{position:fixed;inset:0;background:rgba(20,10,35,.85);backdrop-filter:blur(6px);z-index:30;display:flex;align-items:flex-end;justify-content:center;}
#actionPanel .sheet{background:var(--deep-purple);width:100%;max-width:420px;border-radius:24px 24px 0 0;padding:24px;display:flex;gap:14px;justify-content:center;}
#actionPanel button.act{background:rgba(255,255,255,.08);border:1px solid rgba(255,227,238,.25);border-radius:18px;padding:16px 20px;font-size:24px;color:var(--ink);cursor:pointer;}
#profilePanel .sheet{background:var(--deep-purple);width:100%;max-width:420px;height:100%;padding:24px;overflow-y:auto;position:relative;}
.pfield{margin-top:18px;}
.pfield label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
.stats-row{display:flex;gap:10px;margin-top:10px;}
.stat{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:12px;text-align:center;}
.stat .n{font-size:20px;font-weight:700;}
.stat .l{font-size:11px;color:var(--muted);}
#dayCounter{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;color:var(--soft-pink);margin-top:6px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}
.avatar-big{width:90px;height:90px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--soft-purple),var(--rose-gold));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto;}

@media (max-width:360px){
  .card{padding:20px 10px 14px;}
  .emoji{font-size:44px;}
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="glow-orb" style="width:280px;height:280px;top:-60px;left:-60px;background:var(--soft-purple);"></div>
<div class="glow-orb" style="width:260px;height:260px;bottom:-60px;right:-40px;background:var(--rose-gold);"></div>
<div id="statusBubble"></div>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="headline">
    <div class="wordmark">Ever After</div>
    <div class="subline">choose who's unlocking tonight</div>
  </div>
  <div id="userSelect"></div>
  <div id="passwordPanel">
    <div class="selected-emoji" id="pwEmoji"></div>
    <div class="pw-label">Enter password to continue</div>
    <input type="password" id="pwInput" placeholder="••••••••" autocomplete="off">
    <div class="error-msg" id="pwError"></div>
    <div class="btn-row">
      <button class="ghost" id="backBtn">Back</button>
      <button class="primary" id="unlockBtn">Unlock</button>
    </div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen" class="hidden">
  <div id="topBar">
    <div class="avatar" id="partnerAvatar"></div>
    <div class="tinfo">
      <div class="tname" id="partnerName"></div>
      <div class="tstatus" id="partnerStatus"></div>
    </div>
  </div>
  <div id="moodBar"></div>
  <div id="messages"></div>
  <div id="inputRow">
    <button id="emojiBtn"></button>
    <button id="attachBtn">📎</button>
    <input type="file" id="fileInput" accept="image/*,video/*" class="hidden">
    <input type="text" id="textInput" placeholder="Type a message...">
    <button id="micBtn">🎤</button>
    <button id="sendBtn">➤</button>
  </div>
</div>

<!-- ACTION SHEET -->
<div id="actionPanel" class="hidden">
  <div class="sheet">
    <button class="act" data-act="kiss">💋</button>
    <button class="act" data-act="hug">🤗</button>
    <button class="act" data-act="slap">👋</button>
  </div>
</div>

<!-- PROFILE PANEL -->
<div id="profilePanel" class="hidden">
  <div class="sheet">
    <button class="close-x" id="closeProfile">✕</button>
    <div class="avatar-big" id="myAvatarBig"></div>
    <input type="file" id="avatarInput" accept="image/*" class="hidden">
    <div style="text-align:center;margin-top:10px;"><button class="ghost" id="changeAvatarBtn">Change photo</button></div>
    <div class="pfield" style="text-align:center;">
      <div style="font-size:20px;font-weight:600;" id="myName"></div>
      <div id="dayCounter"></div>
      <div class="subline" id="startDateLabel"></div>
    </div>
    <div class="stats-row">
      <div class="stat"><div class="n" id="statKiss">0</div><div class="l">💋 Kisses</div></div>
      <div class="stat"><div class="n" id="statHug">0</div><div class="l">🤗 Hugs</div></div>
      <div class="stat"><div class="n" id="statSlap">0</div><div class="l">👋 Slaps</div></div>
    </div>
    <div class="pfield">
      <label>Your birthday</label>
      <input type="date" id="birthdayInput">
      <div class="btn-row"><button class="primary" id="saveBirthday">Save</button></div>
    </div>
    <div class="pfield">
      <label>Partner's birthday</label>
      <div id="partnerBirthday" style="color:var(--muted);font-size:14px;">—</div>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG ===================== */
const SUPABASE_URL = "https://lzagntpccmvyirvtzwst.supabase.co";
const SUPABASE_KEY = "sb_publishable_nra8AJ_mOx22lxLj4MpvDw_Zi7ExCnU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "chat-media";
const START_DATE = new Date("2024-01-01"); // TODO: set your real chat-start date

const USERS = {
  irfu: { id:"irfu", emoji:"🧸", password:"irfu" },
  rifu: { id:"rifu", emoji:"👰🏻‍♀️", password:"rifu" }
};
let currentUser = null, partnerId = null, profiles = {};

/* ===================== helpers ===================== */
function showStatus(text, ms){
  ms = ms || 2000;
  const el = document.getElementById('statusBubble');
  el.textContent = text; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, ms);
}
function timeAgo(ts){
  if(!ts) return "offline";
  const diff = Math.floor((Date.now() - new Date(ts).getTime())/1000);
  if(diff<60) return "just now";
  if(diff<3600) return "Last seen "+Math.floor(diff/60)+"m ago";
  if(diff<86400) return "Last seen "+Math.floor(diff/3600)+"h ago";
  if(diff<172800) return "Last seen yesterday";
  return "Last seen "+Math.floor(diff/86400)+"d ago";
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }

/* ===================== lock screen ===================== */
async function loadProfiles(){
  const res = await sb.from('profiles').select('*');
  const data = res.data;
  (data||[]).forEach(function(p){ profiles[p.id]=p; });
}
async function unreadCount(forUser){
  const res = await sb.from('messages').select('id',{count:'exact',head:true}).eq('receiver_id', forUser).eq('seen', false);
  return res.count||0;
}
async function renderUserSelect(){
  await loadProfiles();
  const wrap = document.getElementById('userSelect');
  wrap.innerHTML = '';
  const ids = Object.keys(USERS);
  for(let i=0;i<ids.length;i++){
    const id = ids[i];
    const p = profiles[id] || {};
    const unread = await unreadCount(id);
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = (function(uid){ return function(){ selectUser(uid); }; })(id);
    card.innerHTML =
      '<span class="emoji">'+USERS[id].emoji+'</span>'+
      '<div class="status-line">'+
        '<span class="dot '+(p.online?'':'offline')+'"></span>'+
        '<span>'+(p.online?'Online':timeAgo(p.last_seen))+'</span>'+
      '</div>'+
      (unread>0 ? '<div class="unread">💬 New message</div>' : '');
    wrap.appendChild(card);
  }
}
function selectUser(id){
  currentUser = id;
  document.getElementById('userSelect').style.display='none';
  document.getElementById('pwEmoji').textContent = USERS[id].emoji;
  document.getElementById('pwInput').value=''; document.getElementById('pwError').textContent='';
  document.getElementById('passwordPanel').style.display='block';
  document.getElementById('pwInput').focus();
}
document.getElementById('backBtn').onclick = function(){
  document.getElementById('passwordPanel').style.display='none';
  document.getElementById('userSelect').style.display='flex';
  currentUser=null;
};
document.getElementById('unlockBtn').onclick = tryUnlock;
document.getElementById('pwInput').addEventListener('keydown', function(e){ if(e.key==='Enter') tryUnlock(); });
function tryUnlock(){
  if(!currentUser) return;
  if(document.getElementById('pwInput').value === USERS[currentUser].password){
    enterChat(currentUser);
  } else {
    document.getElementById('pwError').textContent = 'Incorrect password. Try again.';
  }
}

/* ===================== enter chat ===================== */
async function enterChat(id){
  currentUser = id;
  partnerId = Object.keys(USERS).filter(function(u){ return u!==id; })[0];
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('chatScreen').classList.remove('hidden');
  document.getElementById('emojiBtn').textContent = USERS[id].emoji;

  await sb.from('profiles').update({ online:true, last_seen:new Date().toISOString() }).eq('id', id);
  document.addEventListener('visibilitychange', async function(){
    if(document.hidden){ await sb.from('profiles').update({online:false,last_seen:new Date().toISOString()}).eq('id',id); }
    else { await sb.from('profiles').update({online:true}).eq('id',id); }
  });
  setInterval(function(){ sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',id).then(function(){}); }, 30000);

  await loadProfiles();
  renderTopBar();
  renderMoodBar();
  await loadMessages();
  markIncomingSeen();
  subscribeRealtime();
}

function renderTopBar(){
  const p = profiles[partnerId] || {};
  const avatarEl = document.getElementById('partnerAvatar');
  avatarEl.textContent = USERS[partnerId].emoji;
  avatarEl.style.backgroundImage = p.avatar_url ? 'url('+p.avatar_url+')' : '';
  document.getElementById('partnerName').textContent = p.name || partnerId;
  document.getElementById('partnerStatus').textContent = (p.online?'Online':timeAgo(p.last_seen)) + (p.mood? ' · '+p.mood:'');
}
document.getElementById('topBar').onclick = openProfile;

const MOODS = [
  {k:'school',e:'🏫 School'},{k:'work',e:'💼 Work'},{k:'outside',e:'🚶 Outside'},
  {k:'happy',e:'😊 Happy'},{k:'sad',e:'😢 Sad'},{k:'excited',e:'🤩 Excited'},
  {k:'angry',e:'😠 Angry'},{k:'tired',e:'😴 Tired'},{k:'busy',e:'⏳ Busy'}
];
function renderMoodBar(){
  const bar = document.getElementById('moodBar'); bar.innerHTML='';
  MOODS.forEach(function(m){
    const chip = document.createElement('div');
    chip.className = 'mood-chip' + ((profiles[currentUser]&&profiles[currentUser].mood===m.k)?' active':'');
    chip.textContent = m.e;
    chip.onclick = async function(){
      showStatus('Updating mood...');
      await sb.from('profiles').update({mood:m.k}).eq('id',currentUser);
      profiles[currentUser].mood = m.k;
      renderMoodBar();
    };
    bar.appendChild(chip);
  });
}

/* ===================== messages ===================== */
async function loadMessages(){
  const res = await sb.from('messages').select('*')
    .or('and(sender_id.eq.'+currentUser+',receiver_id.eq.'+partnerId+'),and(sender_id.eq.'+partnerId+',receiver_id.eq.'+currentUser+')')
    .order('created_at',{ascending:true}).limit(200);
  const wrap = document.getElementById('messages'); wrap.innerHTML='';
  (res.data||[]).forEach(renderMessage);
  wrap.scrollTop = wrap.scrollHeight;
}
function renderMessage(m){
  const wrap = document.getElementById('messages');
  const mine = m.sender_id === currentUser;
  const div = document.createElement('div');
  if(m.type==='action'){
    div.className='bubble action';
    const labels = {
      kiss: mine?'You kissed her 💋':'He kissed you 💋',
      hug: mine?'You hugged her 🤗':'He hugged you 🤗',
      slap: mine?'You slapped her 👋':'He slapped you 👋'
    };
    div.textContent = labels[m.content] || m.content;
  } else {
    div.className = 'bubble ' + (mine?'me':'them');
    let inner = '';
    if(m.type==='text') inner = m.content;
    else if(m.type==='voice') inner = '<audio controls src="'+m.media_url+'"></audio>';
    else if(m.type==='image') inner = '<img src="'+m.media_url+'">';
    else if(m.type==='video') inner = '<video controls src="'+m.media_url+'"></video>';
    const ticks = mine ? (m.seen ? '✓✓' : '✓') : '';
    inner += '<div class="meta">'+fmtTime(m.created_at)+(m.seen&&m.seen_at?' · Seen '+fmtTime(m.seen_at):'')+' '+ticks+'</div>';
    div.innerHTML = inner;
  }
  div.dataset.id = m.id;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
}
async function sendMessage(payload){
  showStatus(payload.type==='voice'?'Sending voice message...':payload.type==='image'?'Sending image...':payload.type==='video'?'Sending video...':'Sending message...');
  const row = Object.assign({ sender_id:currentUser, receiver_id:partnerId }, payload);
  const res = await sb.from('messages').insert(row).select().single();
  if(res.data) renderMessage(res.data);
  showStatus('All good', 1200);
}
document.getElementById('sendBtn').onclick = function(){
  const input = document.getElementById('textInput');
  const val = input.value.trim();
  if(!val) return;
  input.value='';
  sendMessage({ type:'text', content:val });
};
document.getElementById('textInput').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('sendBtn').click(); });

/* mark messages from partner as seen */
async function markIncomingSeen(){
  await sb.from('messages').update({seen:true, seen_at:new Date().toISOString()})
    .eq('receiver_id', currentUser).eq('seen', false).select();
}

/* ===================== actions (kiss/hug/slap) ===================== */
document.getElementById('emojiBtn').onclick = function(){ document.getElementById('actionPanel').classList.remove('hidden'); };
document.getElementById('actionPanel').onclick = function(e){ if(e.target.id==='actionPanel') e.currentTarget.classList.add('hidden'); };
document.querySelectorAll('#actionPanel .act').forEach(function(btn){
  btn.onclick = async function(){
    const act = btn.dataset.act;
    document.getElementById('actionPanel').classList.add('hidden');
    await sendMessage({ type:'action', content:act });
    const field = act==='kiss'?'kisses_received':act==='hug'?'hugs_received':'slaps_received';
    const cur = (profiles[partnerId] && profiles[partnerId][field]) || 0;
    const upd = {}; upd[field] = cur+1;
    await sb.from('profiles').update(upd).eq('id', partnerId);
    if(profiles[partnerId]) profiles[partnerId][field] = cur+1;
  };
});

/* ===================== voice ===================== */
let mediaRecorder, chunks=[];
document.getElementById('micBtn').onclick = async function(){
  const btn = document.getElementById('micBtn');
  if(!mediaRecorder || mediaRecorder.state==='inactive'){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder = new MediaRecorder(stream);
      chunks=[];
      mediaRecorder.ondataavailable = function(e){ chunks.push(e.data); };
      mediaRecorder.onstop = async function(){
        showStatus('Sending voice message...');
        const blob = new Blob(chunks,{type:'audio/webm'});
        const path = 'voice/'+crypto.randomUUID()+'.webm';
        await sb.storage.from(BUCKET).upload(path, blob);
        const pub = sb.storage.from(BUCKET).getPublicUrl(path).data;
        await sendMessage({ type:'voice', media_url: pub.publicUrl });
      };
      mediaRecorder.start();
      btn.classList.add('recording');
      showStatus('Recording voice...', 60000);
    }catch(err){ showStatus('Mic permission denied'); }
  } else {
    mediaRecorder.stop();
    btn.classList.remove('recording');
  }
};

/* ===================== image / video ===================== */
document.getElementById('attachBtn').onclick = function(){ document.getElementById('fileInput').click(); };
document.getElementById('fileInput').onchange = async function(e){
  const file = e.target.files[0]; if(!file) return;
  showStatus('Uploading...');
  const path = 'media/'+crypto.randomUUID()+'-'+file.name;
  await sb.storage.from(BUCKET).upload(path, file);
  const pub = sb.storage.from(BUCKET).getPublicUrl(path).data;
  await sendMessage({ type: file.type.indexOf('video')===0?'video':'image', media_url: pub.publicUrl });
  e.target.value='';
};

/* ===================== profile panel ===================== */
function openProfile(){
  const me = profiles[currentUser]||{};
  const bigAvatar = document.getElementById('myAvatarBig');
  bigAvatar.textContent = USERS[currentUser].emoji;
  bigAvatar.style.backgroundImage = me.avatar_url ? 'url('+me.avatar_url+')' : '';
  document.getElementById('myName').textContent = me.name || currentUser;
  const days = Math.floor((Date.now()-START_DATE.getTime())/86400000)+1;
  document.getElementById('dayCounter').textContent = 'Day '+days;
  document.getElementById('startDateLabel').textContent = 'Since '+START_DATE.toLocaleDateString();
  document.getElementById('statKiss').textContent = me.kisses_received||0;
  document.getElementById('statHug').textContent = me.hugs_received||0;
  document.getElementById('statSlap').textContent = me.slaps_received||0;
  document.getElementById('birthdayInput').value = me.birthday || '';
  const partner = profiles[partnerId]||{};
  document.getElementById('partnerBirthday').textContent = partner.birthday ? new Date(partner.birthday).toLocaleDateString() : '—';
  document.getElementById('profilePanel').classList.remove('hidden');
}
document.getElementById('closeProfile').onclick = function(){ document.getElementById('profilePanel').classList.add('hidden'); };
document.getElementById('saveBirthday').onclick = async function(){
  const val = document.getElementById('birthdayInput').value;
  if(!val) return;
  await sb.from('profiles').update({birthday:val}).eq('id',currentUser);
  profiles[currentUser].birthday = val;
  showStatus('Saved');
};
document.getElementById('changeAvatarBtn').onclick = function(){ document.getElementById('avatarInput').click(); };
document.getElementById('avatarInput').onchange = async function(e){
  const file = e.target.files[0]; if(!file) return;
  showStatus('Uploading...');
  const path = 'avatars/'+currentUser+'.jpg';
  await sb.storage.from(BUCKET).upload(path, file, {upsert:true});
  const pub = sb.storage.from(BUCKET).getPublicUrl(path).data;
  await sb.from('profiles').update({avatar_url:pub.publicUrl}).eq('id',currentUser);
  profiles[currentUser].avatar_url = pub.publicUrl;
  document.getElementById('myAvatarBig').style.backgroundImage = 'url('+pub.publicUrl+')';
  showStatus('Photo updated');
};

/* ===================== realtime ===================== */
function subscribeRealtime(){
  sb.channel('room-messages')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, function(payload){
      const m = payload.new;
      const relevant = (m.sender_id===currentUser&&m.receiver_id===partnerId)||(m.sender_id===partnerId&&m.receiver_id===currentUser);
      if(!relevant) return;
      if(m.sender_id===partnerId){
        renderMessage(m);
        markIncomingSeen();
      }
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'messages'}, function(payload){
      const m = payload.new;
      if(m.sender_id!==currentUser) return;
      const el = document.querySelector('.bubble[data-id="'+m.id+'"] .meta');
      if(el) el.textContent = fmtTime(m.created_at)+(m.seen&&m.seen_at?' · Seen '+fmtTime(m.seen_at):'')+' '+(m.seen?'✓✓':'✓');
    })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'profiles'}, function(payload){
      const p = payload.new;
      profiles[p.id] = p;
      if(p.id===partnerId) renderTopBar();
    })
    .subscribe();
}
